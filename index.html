<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shiny App</title>
    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "python",
        relPath: "",
      });
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    
  
<script>
(function(){
  if(sessionStorage.getItem("mbp_skip_redirect")) return;
  var shinyGist="https://gist.githubusercontent.com/dsingson5/9082bc53da1e4efb0eeee33246a2d918/raw/mbp_server_url.txt";
  var proxyGist="https://gist.githubusercontent.com/dsingson5/20210ef251a6c4ebf1141068e9be2717/raw/proxy_url.txt";
  fetch(shinyGist,{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
    if(!d.shiny_url) return;
    var shinyUrl=d.shiny_url;
    fetch(proxyGist,{cache:"no-store"}).then(function(r2){return r2.text();}).then(function(apiUrl){
      apiUrl=apiUrl.trim().replace(/\/$/,"");
      if(!apiUrl) return;
      fetch(apiUrl+"/api/ping",{mode:"cors",cache:"no-store"}).then(function(r3){
        if(r3.ok){
          var lbl=document.getElementById("mbpProgressLabel");
          var fill=document.getElementById("mbpProgressFill");
          if(lbl) lbl.textContent="Server found! Redirecting...";
          if(fill) fill.style.width="100%";
          window.location.replace(shinyUrl+"?source=beta");
        }
      }).catch(function(){});
    }).catch(function(){});
  }).catch(function(){});
})();
</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://pypi.org" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="dns-prefetch" href="https://pypi.org">
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}
</script>
</head>
  <body>
<style>
.mbp-loading-overlay {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: #222; z-index: 99999; display: flex; flex-direction: column;
  justify-content: center; align-items: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.mbp-loading-overlay h2 { color: #e0e0e0; font-size: 1.5rem; margin-bottom: 0.5rem; }
.mbp-loading-overlay p { color: #aaa; font-size: 1rem; margin-bottom: 1.2rem; text-align: center; line-height: 1.5; }
.mbp-loading-overlay .mbp-updated { color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
.mbp-progress-container { width: 280px; margin-bottom: 18px; }
.mbp-progress-bar { width: 100%; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
.mbp-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #0074D9, #39CCCC); border-radius: 3px; transition: width 0.5s ease; }
.mbp-progress-label { color: #888; font-size: 0.75rem; margin-top: 6px; text-align: center; }
.mbp-skeleton-container { width: 340px; }
.mbp-skeleton {
  height: 16px; border-radius: 8px; margin-bottom: 12px;
  background: linear-gradient(90deg, #333 25%, #444 50%, #333 75%);
  background-size: 200% 100%;
  animation: mbp-shimmer 1.5s ease-in-out infinite;
}
.mbp-skeleton.w80 { width: 80%; } .mbp-skeleton.w60 { width: 60%; }
.mbp-skeleton.w90 { width: 90%; } .mbp-skeleton.w70 { width: 70%; }
.mbp-skeleton.w50 { width: 50%; }
.mbp-skeleton.tall { height: 24px; margin-bottom: 18px; }
@keyframes mbp-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
<div class="mbp-loading-overlay" id="mbpLoadingOverlay">
  <h2>Metric Based Phasing — BETA <span style="font-size:0.45em;font-weight:600;padding:2px 10px;border-radius:8px;vertical-align:middle;background:rgba(56,189,248,0.15);color:#38bdf8;margin-left:6px;">☁️ Shinylive</span></h2>
  <p>For first time loading the webapp, this might take long.<br>Kindly wait. Thank you!</p>
  <div class="mbp-updated">Last updated: February 14, 2026 — 01:41 PM PHT</div>
  <div class="mbp-progress-container">
    <div class="mbp-progress-bar"><div class="mbp-progress-fill" id="mbpProgressFill"></div></div>
    <div class="mbp-progress-label" id="mbpProgressLabel">Checking for dedicated server...</div>
  </div>
  <div class="mbp-skeleton-container">
    <div class="mbp-skeleton tall w80"></div>
    <div class="mbp-skeleton w90"></div>
    <div class="mbp-skeleton w60"></div>
    <div class="mbp-skeleton w70"></div>
    <div class="mbp-skeleton w50"></div>
    <div class="mbp-skeleton w80"></div>
  </div>
</div>
<script>
(function(){
  var fill = document.getElementById("mbpProgressFill");
  var label = document.getElementById("mbpProgressLabel");
  var steps = [
    {pct: 5,  text: "Checking for dedicated server...", delay: 0},
    {pct: 15, text: "Server not found — loading Shinylive...", delay: 4500},
    {pct: 35, text: "Downloading Python runtime...", delay: 6000},
    {pct: 55, text: "Loading core packages...", delay: 10000},
    {pct: 75, text: "Installing dependencies...", delay: 16000},
    {pct: 90, text: "Almost ready...", delay: 27000}
  ];
  steps.forEach(function(s){
    setTimeout(function(){
      if(fill && label){ fill.style.width = s.pct + "%"; label.textContent = s.text; }
    }, s.delay);
  });

  var observer = new MutationObserver(function(mutations){
    if(document.querySelector("#shiny-app") || document.querySelector(".container-fluid") || document.querySelector(".navbar")){
      if(fill) fill.style.width = "100%";
      if(label) label.textContent = "Ready!";
      var ol = document.getElementById("mbpLoadingOverlay");
      if(ol){ ol.style.transition="opacity 0.5s"; ol.style.opacity="0"; setTimeout(function(){ ol.remove(); },600); }
      observer.disconnect();
    }
  });
  observer.observe(document.body, {childList: true, subtree: true});
  setTimeout(function(){ var ol=document.getElementById("mbpLoadingOverlay"); if(ol) ol.remove(); }, 120000);
})();
</script>

    
    <div style="height: 100vh; width: 100vw" id="root"></div>
    
  </body>
</html>
